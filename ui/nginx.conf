server {
  listen 80;
  server_name _;

  # Имя backend ищем в момент запроса (DNS Docker), а не при старте:
  # иначе nginx падает, если поднялся раньше бэкенда.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8000;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: любой не-API путь -> index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Проксируем API-запросы на бэкенд (внутри docker network)
  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Swagger UI бэкенда — для тех, кто пишет автотесты
  location /docs {
    proxy_pass $backend;
    proxy_set_header Host $host;
  }
  location /openapi.json {
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  # Health-check бэкенда (адрес из README: http://localhost:8080/health)
  location = /health {
    proxy_pass $backend;
    proxy_set_header Host $host;
  }
}
